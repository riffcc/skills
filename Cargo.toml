[package]
name = "palace-skills"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
colored = "2"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async
tokio = { version = "1", features = ["full"] }

# Markdown
pulldown-cmark = "0.9"

# Error handling
anyhow = "1"
thiserror = "1"

# TUI and visualization
ratatui = "0.27"
crossterm = "0.27"

[[bin]]
name = "palace-skills"
path = "src/main.rs"

[[bin]]
name = "palace-mask"
path = "src/bin/viewer.rs"
